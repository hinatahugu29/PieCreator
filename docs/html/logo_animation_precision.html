<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PieCreator V2 - Precision</title>
    <style>
        body { background: #050505; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Consolas', monospace; }
        .stage { position: relative; width: 300px; height: 300px; }
        .ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 1px solid rgba(255,165,0,0.1); border-radius: 50%; transform: scale(0); animation: scale-in 0.5s ease-out forwards; }
        .segment { 
            position: absolute; top: 50%; left: 50%; width: 2px; height: 80px; 
            background: linear-gradient(to top, transparent, #ffa500);
            transform-origin: bottom center; opacity: 0;
        }
        .dot {
            position: absolute; top: -5px; left: -4px; width: 10px; height: 10px;
            background: #ffa500; border-radius: 50%; box-shadow: 0 0 15px #ffa500;
        }
        .text {
            position: absolute; width: 100%; text-align: center; bottom: -80px;
            font-size: 14px; letter-spacing: 0.5em; color: #ffa500; opacity: 0;
            animation: fade-in 1s ease-out forwards 2.5s;
        }
        @keyframes scale-in { to { transform: scale(1); } }
        @keyframes fade-in { to { opacity: 1; } }
        @keyframes segment-pop {
            0% { transform: translate(-50%, -100%) scaleY(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -100%) scaleY(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="ring"></div>
        <div id="segments"></div>
        <div class="text">PRECISION INTERFACE v2</div>
    </div>
    <script>
        const container = document.getElementById('segments');
        for (let i = 0; i < 8; i++) {
            const s = document.createElement('div');
            s.className = 'segment';
            s.style.transform = `translate(-50%, -100%) rotate(${i * 45}deg)`;
            s.style.animation = `segment-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards ${0.5 + i * 0.2}s`;
            
            const dot = document.createElement('div');
            dot.className = 'dot';
            s.appendChild(dot);
            container.appendChild(s);
        }
    </script>
</body>
</html>
