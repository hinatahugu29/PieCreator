<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PieCreator V2 Logo Animation</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --accent-color: #3b82f6;
            /* Modern Blue */
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-color: #ffffff;
            --segment-bg: rgba(255, 255, 255, 0.05);
            --segment-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Glow */
        .glow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--accent-color);
            filter: blur(80px);
            border-radius: 50%;
            opacity: 0;
            animation: glow-in 2s ease-out forwards 0.5s;
        }

        /* Pie Container */
        .pie-container {
            position: relative;
            width: 240px;
            height: 240px;
            transform: rotate(-22.5deg);
            /* Start position */
        }

        /* Segments */
        .segment {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            background: var(--segment-bg);
            border: 1px solid var(--segment-border);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            transform-origin: center;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Central Core */
        .core {
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--text-color);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 30px var(--accent-glow);
            opacity: 0;
            transform: scale(0);
            animation: core-pop 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.3s;
        }

        /* Text Label */
        .label {
            position: absolute;
            bottom: -60px;
            color: var(--text-color);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0;
            transform: translateY(20px);
            animation: text-in 1.2s ease-out forwards 1.2s;
            text-align: center;
            width: 100%;
        }

        .label span {
            color: var(--accent-color);
        }

        /* Animations */
        @keyframes core-pop {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow-in {
            to {
                opacity: 0.4;
            }
        }

        @keyframes text-in {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Interactive / Auto Animation Script Control */
        .pie-active .segment {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="glow"></div>
        <div class="core"></div>
        <div class="pie-container" id="pie">
            <!-- Segments generated via JS -->
        </div>
        <div class="label">PIECREATOR <span>V2</span></div>
    </div>

    <script>
        const container = document.getElementById('pie');
        const segmentCount = 8;
        const radius = 90;

        for (let i = 0; i < segmentCount; i++) {
            const el = document.createElement('div');
            el.className = 'segment';

            // Calculate position
            const angle = (i * 45) * (Math.PI / 180);
            const tx = Math.cos(angle) * radius;
            const ty = Math.sin(angle) * radius;

            // Apply delay and initial transform
            el.style.transitionDelay = `${0.6 + (i * 0.05)}s`;

            container.appendChild(el);

            // Set final transform after a tiny delay
            setTimeout(() => {
                el.style.opacity = '1';
                el.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${i * 45}deg) scale(1)`;
            }, 100);
        }

        // Add a subtle continuous rotation
        setTimeout(() => {
            container.style.transition = 'transform 20s linear';
            container.style.transform = 'rotate(337.5deg)';
        }, 2000);
    </script>
</body>

</html>
