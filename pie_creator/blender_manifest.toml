schema_version = "1.0.0"

id = "pie_creator"
name = "PieCreator"
tagline = "Build context-aware pie menus from any operator, property or macro"
version = "11.0.0"
type = "add-on"

maintainer = "hinata_hugu <hinata.hugu29@gmail.com>"
website = "https://github.com/hinatahugu29/PieCreator"

tags = ["Interface", "User Interface"]

# bl_info の "blender" と揃えること。片方だけ上げると、配布形式によって
# 対応バージョンが食い違う。
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 hinata_hugu"]

# 配布物に含めないもの。アドオン本体だけを同梱する。
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  # ops/designer.py が実行時に生成する成果物。利用者の環境で作られるため、
  # 配布物に古いものを混ぜない。
  "designer/blender_catalog.js",
]
